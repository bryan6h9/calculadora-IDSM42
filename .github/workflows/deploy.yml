name: Despliegue HTML - CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos HTML
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Subir archivos de la pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar pagina HTML
        id: deployment
        uses: actions/deploy-pages@v4