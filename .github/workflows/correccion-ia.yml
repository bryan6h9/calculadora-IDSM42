name: Proponer corrección con Gemini

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: Archivo de la calculadora que Gemini debe editar
        type: choice
        required: true
        options: [index.html, calculadora.py, app.py]
      solicitud:
        description: Describe el problema y el resultado esperado
        type: string
        required: true
      simulacion:
        description: Generar y probar la corrección sin abrir un PR
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  generar:
    outputs:
      propuesta: ${{ steps.propuesta.outputs.existe }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ARCHIVO: ${{ inputs.archivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar solicitud
        env:
          SOLICITUD: ${{ inputs.solicitud }}
        run: |
          case "$ARCHIVO" in index.html|calculadora.py|app.py) ;; *) exit 1 ;; esac
          test -n "$SOLICITUD"
          {
            printf 'Archivo: %s\nSolicitud: %s\n\nContenido original:\n' "$ARCHIVO" "$SOLICITUD"
            cat "$ARCHIVO"
          } > solicitud.txt
      - name: Pedir corrección a Gemini
        id: agente
        uses: docker/docker-agent-action@v2.1.0
        with:
          agent: ./agents/corrector.yaml
          prompt: Devuelve la propuesta de mantenimiento indicada en el archivo adjunto.
          add-prompt-files: solicitud.txt
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          timeout: 120
          retry-on-timeout: 1
          total-timeout: 300
          yolo: false
          skip-summary: true
      - name: Extraer propuesta y comprobar sintaxis
        id: propuesta
        env:
          EXIT_CODE: ${{ steps.agente.outputs.exit-code }}
          OUTPUT_FILE: ${{ steps.agente.outputs.output-file }}
          SECRETS_DETECTED: ${{ steps.agente.outputs.secrets-detected }}
        run: |
          test "$EXIT_CODE" = 0
          test "$SECRETS_DETECTED" = false
          python scripts/propuesta.py
      - uses: actions/upload-artifact@v4
        with:
          name: propuesta-gemini
          path: revision/

  validar:
    if: needs.generar.outputs.propuesta == 'true'
    needs: generar
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ARCHIVO: ${{ inputs.archivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: propuesta-gemini
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validar Docker
        run: |
          cp propuesta.txt "$ARCHIVO"
          docker build -t calculadora:propuesta .
          docker run --rm -d --name calculadora-propuesta -p 127.0.0.1:8080:80 calculadora:propuesta
          trap 'docker stop calculadora-propuesta' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 5 \
            http://127.0.0.1:8080/ -o servido.html
          cmp index.html servido.html
      - name: Ejecutar pytest en un contenedor sin red
        run: bash scripts/probar-propuesta-docker.sh

  publicar:
    if: ${{ !inputs.simulacion && github.ref == 'refs/heads/main' }}
    needs: validar
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/publicar-propuesta.yml
    with:
      origen: ${{ fromJSON(github.run_id) }}
      misma_ejecucion: true
