<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | CI/CD GitHub Actions</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .contenedor {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .subtitulo {
            margin-bottom: 25px;
            color: #94a3b8;
        }

        .calculadora {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        #pantalla {
            width: 100%;
            height: 70px;
            background: #020617;
            border: none;
            border-radius: 10px;
            color: #22c55e;
            font-size: 30px;
            text-align: right;
            padding: 15px;
            margin-bottom: 20px;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            background: #334155;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #475569;
            transform: scale(1.05);
        }

        .operador {
            background: #0284c7;
        }

        .operador:hover {
            background: #0369a1;
        }

        .igual {
            background: #16a34a;
        }

        .igual:hover {
            background: #15803d;
        }

        .limpiar {
            background: #dc2626;
        }

        .limpiar:hover {
            background: #b91c1c;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora CI/CD</h1>

        <p class="subtitulo">
            Proyecto DevOps - GitHub Actions
        </p>

        <div class="calculadora">

            <input type="text" id="pantalla" readonly>

            <div class="botones">

                <button class="limpiar" onclick="limpiar()">C</button>
                <button onclick="agregar('(')">(</button>
                <button onclick="agregar(')')">)</button>
                <button class="operador" onclick="agregar('/')">÷</button>

                <button onclick="agregar('7')">7</button>
                <button onclick="agregar('8')">8</button>
                <button onclick="agregar('9')">9</button>
                <button class="operador" onclick="agregar('*')">×</button>

                <button onclick="agregar('4')">4</button>
                <button onclick="agregar('5')">5</button>
                <button onclick="agregar('6')">6</button>
                <button class="operador" onclick="agregar('-')">−</button>

                <button onclick="agregar('1')">1</button>
                <button onclick="agregar('2')">2</button>
                <button onclick="agregar('3')">3</button>
                <button class="operador" onclick="agregar('+')">+</button>

                <button onclick="agregar('0')">0</button>
                <button onclick="agregar('.')">.</button>
                <button onclick="borrar()">⌫</button>
                <button class="igual" onclick="calcular()">=</button>

            </div>

        </div>

        <p class="footer">
            Desarrollado por Bryan | GitHub Actions CI/CD
        </p>

    </div>

    <script>

        const pantalla = document.getElementById("pantalla");

        function agregar(valor) {
            pantalla.value += valor;
        }

        function limpiar() {
            pantalla.value = "";
        }

        function borrar() {
            pantalla.value = pantalla.value.slice(0, -1);
        }

        function calcular() {
            try {
                const expresion = pantalla.value;

                if (!/^[0-9+\-*/().\s]+$/.test(expresion)) {
                    throw new Error("Expresión inválida");
                }

                const resultado = Function(
                    '"use strict"; return (' + expresion + ')'
                )();

                if (!Number.isFinite(resultado)) {
                    throw new Error("Resultado inválido");
                }

                pantalla.value = resultado;

            } catch (error) {
                pantalla.value = "Error";
            }
        }

    </script>

</body>
</html>
